<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button reference</title><link rel="stylesheet" href="component.css"></head>
<body>
  <main class="demo">
    <h1>Button roles</h1>
    <p>These controls demonstrate native button semantics. Connect them to real actions in the host product.</p>
    <div class="cc-button-row">
      <button class="cc-button cc-button--primary" type="button">Save changes</button>
      <button class="cc-button cc-button--secondary" type="button">Cancel</button>
      <button class="cc-button cc-button--danger" type="button">Delete draft</button>
      <button class="cc-button cc-button--secondary" type="button" disabled>Unavailable</button>
    </div>
  </main>
</body>
</html>
